{{- if ne .Values.confirm "CONFIRM-RESTORE" }}
{{- fail "SECURITE : vous devez passer --set confirm=CONFIRM-RESTORE pour lancer une restauration." }}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-scripts
data:
  aws-config: |
    [default]
    region = {{ .Values.s3.region }}
    s3 =
      addressing_style = path

  download.sh: |
    #!/bin/sh
    set -eu

    DEST="s3://${S3_BUCKET}/${S3_PREFIX}"
    if [ "${BACKUP_TIMESTAMP}" = "latest" ]; then
      TS=$(aws --endpoint-url "${S3_ENDPOINT}" s3 cp "${DEST}/LATEST" - | tr -d '[:space:]')
    else
      TS="${BACKUP_TIMESTAMP}"
    fi

    echo "Téléchargement du backup ${TS}..."
    aws --endpoint-url "${S3_ENDPOINT}" s3 cp "${DEST}/${TS}/${PGDATABASE}.dump" "/work/${PGDATABASE}.dump" --only-show-errors
    echo "Fichier téléchargé avec succès."

  restore.sh: |
    #!/bin/sh
    set -eu

    echo "Fermeture des connexions actives sur ${PGDATABASE}..."
    psql -d postgres -c "SELECT pg_terminate_backend(pid) FROM pg_stat_activity WHERE datname = '${PGDATABASE}' AND pid <> pg_backend_pid();"

    echo "Restauration de la base ${PGDATABASE}..."
    pg_restore -d "${PGDATABASE}" --clean --if-exists --single-transaction "/work/${PGDATABASE}.dump"
    echo "Restauration terminée avec succès."
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      {{- with .Values.images.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: work
          emptyDir:
            sizeLimit: {{ .Values.workVolumeSize }}
        - name: scripts
          configMap:
            name: {{ .Release.Name }}-scripts
            defaultMode: 0755
      initContainers:
        - name: s3-download
          image: {{ .Values.images.awsCli | quote }}
          command: ["/scripts/download.sh"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          env:
            - name: HOME
              value: /tmp
            - name: AWS_CONFIG_FILE
              value: /scripts/aws-config
            - name: S3_ENDPOINT
              value: {{ .Values.s3.endpoint | quote }}
            - name: S3_BUCKET
              value: {{ .Values.s3.bucket | quote }}
            - name: S3_PREFIX
              value: {{ .Values.s3.prefix | quote }}
            - name: PGDATABASE
              value: {{ .Values.postgres.database | quote }}
            - name: BACKUP_TIMESTAMP
              value: {{ .Values.backupTimestamp | quote }}
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.s3.secretName }}
                  key: {{ .Values.s3.accessKeyIdKey }}
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.s3.secretName }}
                  key: {{ .Values.s3.secretAccessKeyKey }}
          volumeMounts:
            - name: work
              mountPath: /work
            - name: scripts
              mountPath: /scripts
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      containers:
        - name: pg-restore
          image: {{ .Values.images.postgres | quote }}
          command: ["/scripts/restore.sh"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          env:
            - name: PGHOST
              value: {{ .Values.postgres.host | quote }}
            - name: PGPORT
              value: {{ .Values.postgres.port | quote }}
            - name: PGUSER
              value: {{ .Values.postgres.user | quote }}
            - name: PGDATABASE
              value: {{ .Values.postgres.database | quote }}
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgres.secretName }}
                  key: {{ .Values.postgres.passwordKey }}
          volumeMounts:
            - name: work
              mountPath: /work
            - name: scripts
              mountPath: /scripts
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
