apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-scripts
data:
  run.py: |
    import os
    import sys
    import json
    import urllib.request
    import urllib.parse

    def http_json(url, method="GET", data=None, headers=None):
        req_headers = headers or {}
        body = json.dumps(data).encode("utf-8") if data is not None else None
        req = urllib.request.Request(url, data=body, headers=req_headers, method=method)
        with urllib.request.urlopen(req, timeout=30) as resp:
            return json.loads(resp.read().decode("utf-8"))

    def download_model():
        repo_id = os.environ.get("MODEL_REPO_ID", "").strip()
        if not repo_id:
            return

        endpoint = os.environ["HF_ENDPOINT"].rstrip("/")
        revision = os.environ.get("MODEL_REVISION", "main")
        target_dir = os.environ["TARGET_DIR"]
        token = os.environ.get("HF_TOKEN")

        headers = {"User-Agent": "runai-model-downloader/1.0"}
        if token:
            headers["Authorization"] = f"Bearer {token}"

        info_url = f"{endpoint}/api/models/{repo_id}/revision/{revision}"
        print(f"[1/2] Récupération de la liste des fichiers depuis {info_url}...")
        info = http_json(info_url, headers=headers)
        files = info.get("siblings", [])

        for i, item in enumerate(files, 1):
            fname = item["rfilename"]
            dest = os.path.join(target_dir, fname)
            os.makedirs(os.path.dirname(dest), exist_ok=True)

            if item.get("size") and os.path.exists(dest) and os.path.getsize(dest) == item["size"]:
                print(f"  [{i}/{len(files)}] {fname} (déjà présent)")
                continue

            print(f"  [{i}/{len(files)}] Téléchargement de {fname}...")
            url = f"{endpoint}/{repo_id}/resolve/{revision}/{fname}"
            req = urllib.request.Request(url, headers=headers)
            with urllib.request.urlopen(req) as resp, open(dest, "wb") as out:
                while chunk := resp.read(16 * 1024 * 1024):
                    out.write(chunk)

    def register_datavolume():
        if os.environ.get("RUNAI_ENABLED", "true").lower() != "true":
            return

        base_url = os.environ["RUNAI_URL"].rstrip("/")
        client_id = os.environ["RUNAI_CLIENT_ID"]
        client_secret = os.environ["RUNAI_CLIENT_SECRET"]
        project_name = os.environ["RUNAI_PROJECT_NAME"]
        pvc_name = os.environ["PVC_NAME"]
        dv_name = os.environ["RUNAI_DV_NAME"]
        dv_desc = os.environ.get("RUNAI_DV_DESC", "")

        print(f"[2/2] Authentification sur {base_url}...")
        token_resp = http_json(
            f"{base_url}/api/v1/token",
            method="POST",
            data={"grantType": "client_credentials", "clientId": client_id, "clientSecret": client_secret},
            headers={"Content-Type": "application/json"}
        )
        token = token_resp.get("accessToken") or token_resp.get("access_token")
        headers = {"Authorization": f"Bearer {token}", "Content-Type": "application/json"}

        q = urllib.parse.urlencode({"filterBy": f"name=={project_name}"})
        projects = http_json(f"{base_url}/api/v1/org-unit/projects?{q}", headers=headers).get("projects", [])
        project_id = next((str(p["id"]) for p in projects if p.get("name") == project_name), None)
        if not project_id:
            sys.exit(f"Erreur : projet '{project_name}' introuvable dans Run:ai.")

        print(f"Enregistrement du PVC '{pvc_name}' en Data Volume '{dv_name}' (projectId={project_id})...")
        try:
            http_json(
                f"{base_url}/api/v1/datavolumes",
                method="POST",
                data={
                    "name": dv_name,
                    "description": dv_desc,
                    "originPvcName": pvc_name,
                    "projectId": project_id,
                    "useOriginalVolume": True
                },
                headers=headers
            )
            print("Data Volume enregistré avec succès.")
        except urllib.error.HTTPError as e:
            if e.code == 409:
                print("Data Volume déjà enregistré (409 Conflict ignoré).")
            else:
                sys.exit(f"Erreur API Run:ai ({e.code}): {e.read().decode()}")

    if __name__ == "__main__":
        download_model()
        register_datavolume()
