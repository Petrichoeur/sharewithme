apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 1
  template:
    spec:
      restartPolicy: Never
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: scripts
          configMap:
            name: {{ .Release.Name }}-scripts
            defaultMode: 0755
        - name: model-storage
          persistentVolumeClaim:
            claimName: {{ .Values.storage.pvcName }}
      containers:
        - name: downloader
          image: {{ .Values.image | quote }}
          command: ["python3", "/scripts/run.py"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          env:
            - name: MODEL_REPO_ID
              value: {{ .Values.model.repoId | quote }}
            - name: MODEL_REVISION
              value: {{ .Values.model.revision | quote }}
            - name: HF_ENDPOINT
              value: {{ .Values.model.endpointUrl | quote }}
            - name: TARGET_DIR
              value: {{ .Values.storage.mountPath | quote }}
            - name: PVC_NAME
              value: {{ .Values.storage.pvcName | quote }}
            {{- if .Values.model.tokenSecretName }}
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.model.tokenSecretName }}
                  key: {{ .Values.model.tokenSecretKey }}
            {{- end }}
            - name: RUNAI_ENABLED
              value: {{ .Values.runai.enabled | quote }}
            - name: RUNAI_URL
              value: {{ .Values.runai.url | quote }}
            - name: RUNAI_DV_NAME
              value: {{ .Values.runai.dataVolumeName | quote }}
            - name: RUNAI_DV_DESC
              value: {{ .Values.runai.description | quote }}
            - name: RUNAI_PROJECT_NAME
              value: {{ .Values.runai.projectName | quote }}
            - name: RUNAI_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.runai.secretName }}
                  key: {{ .Values.runai.clientIdKey }}
            - name: RUNAI_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.runai.secretName }}
                  key: {{ .Values.runai.clientSecretKey }}
          volumeMounts:
            - name: scripts
              mountPath: /scripts
            - name: model-storage
              mountPath: {{ .Values.storage.mountPath }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
