image: "registry.entreprise.corp/python:3.11-slim"
imagePullSecrets: []

model:
  repoId: "mistralai/Mistral-7B-v0.1"
  revision: "main"
  endpointUrl: "https://artifactory.internal.corp/artifactory/api/huggingface"
  tokenSecretName: ""
  tokenSecretKey: "HF_TOKEN"

storage:
  pvcName: "mistral-7b-pvc"
  createPvc: true
  size: "16Gi"
  storageClassName: "ocs-storagecluster-ceph-rbd"
  accessMode: "ReadWriteOnce"
  mountPath: "/mnt/models"

runai:
  enabled: true
  url: "https://runai.internal.corp"
  dataVolumeName: "mistral-7b-v0-1"
  description: "Modèle mistralai/Mistral-7B-v0.1"
  projectName: "ai-research"
  secretName: "runai-api-credentials"
  clientIdKey: "CLIENT_ID"
  clientSecretKey: "CLIENT_SECRET"

resources:
  requests:
    cpu: "1"
    memory: "2Gi"
  limits:
    cpu: "4"
    memory: "8Gi"
