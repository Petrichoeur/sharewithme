global:
  imageRegistry: ""
  imagePullSecrets: []

image:
  repository: "python"
  tag: "3.11-slim"
  pullPolicy: IfNotPresent
  pullSecrets: []

model:
  repoId: "mistralai/Mistral-7B-v0.1"
  revision: "main"
  endpointUrl: "https://artifactory.internal.corp/artifactory/api/huggingface"
  tokenSecretName: ""
  tokenSecretKey: "HF_TOKEN"

storage:
  size: "16Gi"
  storageClassName: "ocs-storagecluster-ceph-rbd"
  accessModes:
    - ReadWriteOnce
  mountPath: "/mnt/models"

runai:
  enabled: true
  controlPlaneUrl: "https://runai.internal.corp"
  clusterUuid: ""
  authSecretName: "runai-api-credentials"
  clientIdKey: "CLIENT_ID"
  clientSecretKey: "CLIENT_SECRET"
  dataVolumeName: "mistral-7b-v0-1"
  dataVolumeDescription: "Modèle mistralai/Mistral-7B-v0.1 provisionné depuis Artifactory"
  projectName: "ai-research"

customCa:
  enabled: false
  configMapName: "corp-root-ca"
  caKey: "ca.crt"

securityContext:
  runAsNonRoot: true
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  seccompProfile:
    type: RuntimeDefault

resources:
  limits:
    cpu: "4"
    memory: "8Gi"
  requests:
    cpu: "1"
    memory: "2Gi"
