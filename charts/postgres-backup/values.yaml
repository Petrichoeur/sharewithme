# Configuration du CronJob de backup PostgreSQL & Restauration
# Adapté aux environnements Air-Gapped stricts sans build d'image personnalisé
# Utilise des images officielles standards d'Artifactory sans aucune installation ni build

backupJob:
  # Étape 1 : Image PostgreSQL standard présente dans Artifactory (contient pg_dump et pg_restore)
  postgresImage:
    registry: "artifactory.internal.corp"
    repository: "docker-local/postgres"
    tag: "16-alpine"
    pullPolicy: IfNotPresent

  # Étape 2 : Image S3 standard présente dans Artifactory (amazon/aws-cli, minio/mc ou curlimages/curl)
  # Par défaut, image standard aws-cli officielle ou alpine avec curl
  s3Image:
    registry: "artifactory.internal.corp"
    repository: "docker-local/aws-cli"
    tag: "latest"
    pullPolicy: IfNotPresent

  pullSecrets: []
  # - name: artifactory-dockercfg

cronjob:
  # Exécution quotidienne
  schedule: "0 2 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5

postgres:
  host: "postgres-postgresql.runai.svc.cluster.local"
  port: 5432
  database: "runai"
  username: "postgres"
  existingSecret: ""
  secretKeyRef:
    passwordKey: "postgres-password"
  password: ""
  # Paramètres pg_dump à chaud (format custom compressé)
  pgDumpArgs: "-Fc --verbose --no-owner --no-privileges"

s3:
  # Endpoint S3 interne (MinIO / Ceph / S3 interne)
  endpointUrl: "https://s3.internal.corp"
  region: "us-east-1"
  bucket: "runai-pg-backups"
  prefix: "postgres-runai"
  existingSecret: ""
  accessKeyId: ""
  secretAccessKey: ""

  # Rotation Rolling : conserve strictement les 7 derniers snapshots
  rollingRotation:
    enabled: true
    maxSnapshots: 7

# Restauration à chaud
restore:
  enabled: false
  dumpFile: "latest" # ou nom précis ex: runai_20261009_020000Z.dump
  pgRestoreArgs: "-Fc --clean --if-exists --no-owner --no-privileges --verbose"

securityContext:
  runAsNonRoot: true
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  seccompProfile:
    type: RuntimeDefault

resources:
  limits:
    cpu: "2"
    memory: "2Gi"
  requests:
    cpu: "250m"
    memory: "512Mi"
