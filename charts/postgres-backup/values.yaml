# Global values (communes et surchargeables facilement par ArgoCD / Helm)
global:
  imageRegistry: "artifactory.internal.corp"
  imagePullSecrets: []
  # - name: artifactory-dockercfg

backupJob:
  postgresImage:
    registry: "" # Vide pour hériter de global.imageRegistry
    repository: "docker-local/postgres"
    tag: "16-alpine"
    pullPolicy: IfNotPresent

  s3Image:
    registry: "" # Vide pour hériter de global.imageRegistry
    repository: "docker-local/aws-cli"
    tag: "latest"
    pullPolicy: IfNotPresent

cronjob:
  schedule: "0 2 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5

postgres:
  host: "postgres-postgresql.runai.svc.cluster.local"
  port: 5432
  database: "runai"
  username: "postgres"
  existingSecret: ""
  secretKeyRef:
    passwordKey: "postgres-password"
  password: ""
  pgDumpArgs: "-Fc --verbose --no-owner --no-privileges"

# ==============================================================================
# S3 EXTERNE : Vous n'avez qu'à renseigner l'URL et le SECRET fourni par les équipes !
# ==============================================================================
s3:
  # URL complète fournie par les équipes (ex: https://s3-externe.company.com/mon-bucket ou https://s3.eu-west-3.amazonaws.com/mon-bucket)
  # Si l'URL contient déjà le bucket (ex: https://endpoint/mon-bucket), le chart extrait automatiquement l'endpoint et le bucket.
  url: "https://s3.eu-west-3.amazonaws.com/runai-pg-backups"

  # Nom du Secret K8s existant fourni par les équipes
  existingSecret: "s3-credentials"

  # Clés dans le Secret existant (avec fallbacks automatiques pour s'adapter au format des équipes)
  secretKeyRef:
    accessKeyIdKey: "AWS_ACCESS_KEY_ID"         # ou "access-key", "AWS_ACCESS_KEY", "access_key_id"
    secretAccessKeyKey: "AWS_SECRET_ACCESS_KEY" # ou "secret-key", "AWS_SECRET_KEY", "secret_access_key"

  # Préfixe / dossier dans le bucket
  prefix: "postgres-runai-prod"

  # Région par défaut (us-east-1 standard compatible tout S3, ou région spécifique)
  region: "us-east-1"

  # Proxy d'entreprise sortant si votre OpenShift on-premise doit traverser un proxy pour sortir vers ce S3 externe
  proxy:
    httpProxy: ""
    httpsProxy: ""
    noProxy: "localhost,127.0.0.1,.svc,.cluster.local"

  # Certificat CA d'entreprise si proxy avec interception TLS
  customCa:
    enabled: false
    configMapName: "corp-root-ca"
    caKey: "ca.crt"

  # Rotation Rolling : conserve strictement les N derniers snapshots
  rollingRotation:
    enabled: true
    maxSnapshots: 7

# Restauration à chaud
restore:
  enabled: false
  dumpFile: "latest" # ou nom précis ex: runai_20261009_020000Z.dump
  pgRestoreArgs: "-Fc --clean --if-exists --no-owner --no-privileges --verbose"

securityContext:
  runAsNonRoot: true
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  seccompProfile:
    type: RuntimeDefault

resources:
  limits:
    cpu: "2"
    memory: "2Gi"
  requests:
    cpu: "250m"
    memory: "512Mi"
