global:
  imageRegistry: ""
  imagePullSecrets: []

backupJob:
  postgresImage:
    repository: "postgres"
    tag: "16-alpine"
    pullPolicy: IfNotPresent
  s3Image:
    repository: "amazon/aws-cli"
    tag: "latest"
    pullPolicy: IfNotPresent

cronjob:
  schedule: "0 2 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5

workVolume:
  sizeLimit: "20Gi"

postgres:
  host: "runai-backend-postgresql.runai-backend.svc.cluster.local"
  port: 5432
  username: "postgres"
  existingSecret: "runai-backend-postgresql"
  secretKeyRef:
    passwordKey: "postgres-password"
  pgDumpArgs: "-Fc"

s3:
  url: "https://s3.ecs01.group.gca"
  bucket: ""
  prefix: "runai-backend-postgres"
  region: "us-east-1"
  addressingStyle: "path"
  existingSecret: "accesskey-s3-backup"
  secretKeyRef:
    accessKeyIdKey: "userfa"
    secretAccessKeyKey: "pwdfa"
  restoreSecretKeyRef:
    accessKeyIdKey: "userro"
    secretAccessKeyKey: "pwdro"
  proxy:
    httpProxy: ""
    httpsProxy: ""
    noProxy: "localhost,127.0.0.1,.svc,.cluster.local"
  customCa:
    enabled: false
    configMapName: "corp-root-ca"
    caKey: "ca.crt"
  rollingRotation:
    enabled: true
    maxSnapshots: 7

restore:
  enabled: false
  confirm: ""
  backup: "latest"
  pgRestoreArgs: "--clean --if-exists --single-transaction"

securityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

resources:
  limits:
    cpu: "2"
    memory: "2Gi"
  requests:
    cpu: "250m"
    memory: "512Mi"
