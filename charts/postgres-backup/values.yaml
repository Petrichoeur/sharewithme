global:
  imageRegistry: ""
  imagePullSecrets: []

backupJob:
  postgresImage:
    repository: "postgres"
    tag: "16-alpine"
    pullPolicy: IfNotPresent
  s3Image:
    repository: "amazon/aws-cli"
    tag: "2.15.30"
    pullPolicy: IfNotPresent
  pullSecrets: []

cronjob:
  schedule: "0 2 * * *"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 300
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  backoffLimit: 1
  activeDeadlineSeconds: 7200

workVolume:
  sizeLimit: "20Gi"

postgres:
  host: "runai-backend-postgresql.runai-backend.svc.cluster.local"
  port: 5432
  username: "postgres"
  # Liste des bases à sauvegarder. Vide = détection automatique de toutes les bases non-template.
  databases: []
  existingSecret: "runai-backend-postgresql"
  secretKeyRef:
    passwordKey: "postgres-password"
  pgDumpArgs: "-Fc"

s3:
  url: "https://s3.ecs01.group.gca"
  bucket: ""
  prefix: "runai-backend-postgres"
  region: "us-east-1"
  addressingStyle: "path"
  existingSecret: "accesskey-s3-backup"
  secretKeyRef:
    accessKeyIdKey: "userfa"
    secretAccessKeyKey: "pwdfa"
  proxy:
    httpProxy: ""
    httpsProxy: ""
    noProxy: "localhost,127.0.0.1,.svc,.cluster.local"
  customCa:
    enabled: false
    configMapName: "corp-root-ca"
    caKey: "ca.crt"
  rollingRotation:
    enabled: true
    maxSnapshots: 7

securityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
  capabilities:
    drop:
      - ALL

resources:
  limits:
    cpu: "2"
    memory: "2Gi"
  requests:
    cpu: "250m"
    memory: "512Mi"
