# Global values (communes et surchargeables facilement par ArgoCD / Helm)
global:
  # Registry d'entreprise (Artifactory, Harbor, Quay)
  imageRegistry: "artifactory.internal.corp"
  # Pull Secrets globaux si nécessaire
  imagePullSecrets: []
  # - name: artifactory-dockercfg

# Images de base standards du backup
backupJob:
  postgresImage:
    registry: "" # Vide pour hériter de global.imageRegistry
    repository: "docker-local/postgres"
    tag: "16-alpine"
    pullPolicy: IfNotPresent

  s3Image:
    registry: "" # Vide pour hériter de global.imageRegistry
    repository: "docker-local/aws-cli"
    tag: "latest"
    pullPolicy: IfNotPresent

cronjob:
  schedule: "0 2 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5

postgres:
  host: "postgres-postgresql.runai.svc.cluster.local"
  port: 5432
  database: "runai"
  username: "postgres"
  existingSecret: ""
  secretKeyRef:
    passwordKey: "postgres-password"
  password: ""
  pgDumpArgs: "-Fc --verbose --no-owner --no-privileges"

# Configuration S3 paramétrable
s3:
  endpointUrl: "https://s3.internal.corp"
  region: "us-east-1"
  bucket: "runai-pg-backups"
  prefix: "postgres-runai"
  existingSecret: ""
  accessKeyId: ""
  secretAccessKey: ""

  # Rotation Rolling : conserve strictement les N derniers snapshots
  rollingRotation:
    enabled: true
    maxSnapshots: 7

# Restauration à chaud
restore:
  enabled: false
  dumpFile: "latest" # ou nom précis ex: runai_20261009_020000Z.dump
  pgRestoreArgs: "-Fc --clean --if-exists --no-owner --no-privileges --verbose"

securityContext:
  runAsNonRoot: true
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  seccompProfile:
    type: RuntimeDefault

resources:
  limits:
    cpu: "2"
    memory: "2Gi"
  requests:
    cpu: "250m"
    memory: "512Mi"
