# Global values (communes et surchargeables facilement par ArgoCD / Helm)
global:
  # Registry d'entreprise interne (Artifactory, Harbor, Quay)
  imageRegistry: "artifactory.internal.corp"
  # Pull Secrets globaux si nécessaire
  imagePullSecrets: []
  # - name: artifactory-dockercfg

# Images de base standards du backup
backupJob:
  postgresImage:
    registry: "" # Vide pour hériter de global.imageRegistry
    repository: "docker-local/postgres"
    tag: "16-alpine"
    pullPolicy: IfNotPresent

  s3Image:
    registry: "" # Vide pour hériter de global.imageRegistry
    repository: "docker-local/aws-cli"
    tag: "latest"
    pullPolicy: IfNotPresent

cronjob:
  schedule: "0 2 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5

postgres:
  host: "postgres-postgresql.runai.svc.cluster.local"
  port: 5432
  database: "runai"
  username: "postgres"
  existingSecret: ""
  secretKeyRef:
    passwordKey: "postgres-password"
  password: ""
  pgDumpArgs: "-Fc --verbose --no-owner --no-privileges"

# Configuration S3 externe (ex: AWS S3, Cloud Provider, ou stockage objet distant)
s3:
  # Laisser endpointUrl vide pour AWS S3 public officiel (ex: s3.eu-west-3.amazonaws.com)
  # Ou renseigner l'URL si endpoint dédié/proxy : "https://s3.eu-west-3.amazonaws.com"
  endpointUrl: ""
  region: "eu-west-3"
  bucket: "mon-bucket-s3-externe"
  prefix: "postgres-runai-prod"

  # Secret contenant les clés AWS (recommandé pour la prod)
  existingSecret: ""
  secretKeyRef:
    accessKeyIdKey: "aws-access-key-id"
    secretAccessKeyKey: "aws-secret-access-key"
  accessKeyId: ""
  secretAccessKey: ""

  # Proxy HTTPS sortant si le cluster on-premise doit traverser un proxy d'entreprise
  proxy:
    httpProxy: ""   # ex: "http://proxy.internal.corp:3128"
    httpsProxy: ""  # ex: "http://proxy.internal.corp:3128"
    noProxy: "localhost,127.0.0.1,.svc,.cluster.local"

  # Certificat TLS d'entreprise / Proxy CA (si interception TLS par le proxy sortant)
  customCa:
    enabled: false
    configMapName: "corp-root-ca"
    caKey: "ca.crt"

  # Chiffrement côté serveur S3 (ex: "AES256" ou "aws:kms")
  serverSideEncryption: ""
  kmsKeyId: ""

  # Rotation Rolling : conserve strictement les N derniers snapshots
  rollingRotation:
    enabled: true
    maxSnapshots: 7

# Restauration à chaud
restore:
  enabled: false
  dumpFile: "latest" # ou nom précis ex: runai_20261009_020000Z.dump
  pgRestoreArgs: "-Fc --clean --if-exists --no-owner --no-privileges --verbose"

securityContext:
  runAsNonRoot: true
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  seccompProfile:
    type: RuntimeDefault

resources:
  limits:
    cpu: "2"
    memory: "2Gi"
  requests:
    cpu: "250m"
    memory: "512Mi"
