schedule: "0 2 * * *"

images:
  postgres: "registry.entreprise.corp/postgres:16-alpine"
  awsCli: "registry.entreprise.corp/amazon/aws-cli:2.15.30"
  pullSecrets: []

postgres:
  host: "runai-backend-postgresql.runai-backend.svc.cluster.local"
  port: 5432
  user: "postgres"
  database: "backend"
  secretName: "runai-backend-postgresql"
  passwordKey: "postgres-password"

s3:
  endpoint: "https://s3.ecs01.group.gca"
  bucket: "backup-runai-backend"
  prefix: "postgres"
  region: "us-east-1"
  secretName: "accesskey-s3-backup"
  accessKeyIdKey: "userfa"
  secretAccessKeyKey: "pwdfa"
  retentionCount: 7

workVolumeSize: "20Gi"

resources:
  requests:
    cpu: "250m"
    memory: "512Mi"
  limits:
    cpu: "2"
    memory: "2Gi"
