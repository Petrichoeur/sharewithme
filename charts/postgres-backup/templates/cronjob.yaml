apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-scripts
data:
  aws-config: |
    [default]
    region = {{ .Values.s3.region }}
    s3 =
      addressing_style = path

  dump.sh: |
    #!/bin/sh
    set -eu

    TS=$(date -u +%Y%m%dT%H%M%SZ)
    echo "${TS}" > /work/TIMESTAMP

    echo "Dump de la base ${PGDATABASE} (${TS})..."
    pg_dump -Fc -f "/work/${PGDATABASE}.dump"
    pg_restore --list "/work/${PGDATABASE}.dump" > /dev/null
    echo "Dump terminé et vérifié."

  upload.sh: |
    #!/bin/sh
    set -eu

    TS=$(cat /work/TIMESTAMP)
    DEST="s3://${S3_BUCKET}/${S3_PREFIX}"

    echo "Envoi vers ${DEST}/${TS}/..."
    aws --endpoint-url "${S3_ENDPOINT}" s3 cp "/work/${PGDATABASE}.dump" "${DEST}/${TS}/${PGDATABASE}.dump" --only-show-errors
    aws --endpoint-url "${S3_ENDPOINT}" s3 cp /work/TIMESTAMP "${DEST}/LATEST" --only-show-errors

    echo "Rotation S3 (conservation des ${RETENTION_COUNT} derniers backups)..."
    SNAPSHOTS=$(aws --endpoint-url "${S3_ENDPOINT}" s3 ls "${DEST}/" | awk '/PRE / {sub(/\/$/, "", $2); print $2}' | sort)
    TOTAL=$(echo "${SNAPSHOTS}" | grep -c . || true)

    if [ "${TOTAL}" -gt "${RETENTION_COUNT}" ]; then
      TO_DELETE=$((TOTAL - RETENTION_COUNT))
      for OLD in $(echo "${SNAPSHOTS}" | head -n "${TO_DELETE}"); do
        echo "Suppression de l'ancien backup ${OLD}..."
        aws --endpoint-url "${S3_ENDPOINT}" s3 rm "${DEST}/${OLD}/" --recursive --only-show-errors
      done
    fi
    echo "Backup terminé avec succès."
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ .Release.Name }}
spec:
  schedule: {{ .Values.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        spec:
          restartPolicy: Never
          {{- with .Values.images.pullSecrets }}
          imagePullSecrets:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          securityContext:
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          volumes:
            - name: work
              emptyDir:
                sizeLimit: {{ .Values.workVolumeSize }}
            - name: scripts
              configMap:
                name: {{ .Release.Name }}-scripts
                defaultMode: 0755
          initContainers:
            - name: pg-dump
              image: {{ .Values.images.postgres | quote }}
              command: ["/scripts/dump.sh"]
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
              env:
                - name: PGHOST
                  value: {{ .Values.postgres.host | quote }}
                - name: PGPORT
                  value: {{ .Values.postgres.port | quote }}
                - name: PGUSER
                  value: {{ .Values.postgres.user | quote }}
                - name: PGDATABASE
                  value: {{ .Values.postgres.database | quote }}
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.postgres.secretName }}
                      key: {{ .Values.postgres.passwordKey }}
              volumeMounts:
                - name: work
                  mountPath: /work
                - name: scripts
                  mountPath: /scripts
              resources:
                {{- toYaml .Values.resources | nindent 16 }}
          containers:
            - name: s3-upload
              image: {{ .Values.images.awsCli | quote }}
              command: ["/scripts/upload.sh"]
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
              env:
                - name: HOME
                  value: /tmp
                - name: AWS_CONFIG_FILE
                  value: /scripts/aws-config
                - name: S3_ENDPOINT
                  value: {{ .Values.s3.endpoint | quote }}
                - name: S3_BUCKET
                  value: {{ .Values.s3.bucket | quote }}
                - name: S3_PREFIX
                  value: {{ .Values.s3.prefix | quote }}
                - name: PGDATABASE
                  value: {{ .Values.postgres.database | quote }}
                - name: RETENTION_COUNT
                  value: {{ .Values.s3.retentionCount | quote }}
                - name: AWS_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.s3.secretName }}
                      key: {{ .Values.s3.accessKeyIdKey }}
                - name: AWS_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.s3.secretName }}
                      key: {{ .Values.s3.secretAccessKeyKey }}
              volumeMounts:
                - name: work
                  mountPath: /work
                - name: scripts
                  mountPath: /scripts
              resources:
                {{- toYaml .Values.resources | nindent 16 }}
