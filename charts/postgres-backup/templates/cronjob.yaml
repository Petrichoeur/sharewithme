apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "postgres-backup.fullname" . }}
  labels:
    {{- include "postgres-backup.labels" . | nindent 4 }}
spec:
  schedule: {{ .Values.cronjob.schedule | quote }}
  concurrencyPolicy: {{ .Values.cronjob.concurrencyPolicy }}
  successfulJobsHistoryLimit: {{ .Values.cronjob.successfulJobsHistoryLimit }}
  failedJobsHistoryLimit: {{ .Values.cronjob.failedJobsHistoryLimit }}
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels:
            {{- include "postgres-backup.selectorLabels" . | nindent 12 }}
        spec:
          restartPolicy: OnFailure
          {{- with .Values.image.pullSecrets }}
          imagePullSecrets:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          containers:
            - name: pg-backup
              image: {{ include "postgres-backup.image" . | quote }}
              imagePullPolicy: {{ .Values.image.pullPolicy }}
              command:
                - /bin/sh
                - -c
                - |
                  set -euo pipefail

                  TIMESTAMP=$(date -u +%Y%m%d_%H%M%SZ)
                  BACKUP_FILE="${PGDATABASE}_${TIMESTAMP}.dump"
                  S3_DEST="s3://${S3_BUCKET}/${S3_PREFIX}/${BACKUP_FILE}"
                  LATEST_DEST="s3://${S3_BUCKET}/${S3_PREFIX}/latest.dump"

                  echo "[INFO] Démarrage du dump PostgreSQL à chaud (${PGHOST}:${PGPORT} / base: ${PGDATABASE})..."

                  EXTRA_S3_ARGS=""
                  if [ -n "${S3_ENDPOINT_URL:-}" ]; then
                    EXTRA_S3_ARGS="--endpoint-url ${S3_ENDPOINT_URL}"
                  fi
                  if [ -n "${AWS_CA_BUNDLE:-}" ]; then
                    EXTRA_S3_ARGS="${EXTRA_S3_ARGS} --ca-bundle ${AWS_CA_BUNDLE}"
                  fi

                  # Streaming direct pg_dump -> S3 (zéro stockage disque local)
                  pg_dump -h "${PGHOST}" -p "${PGPORT}" -U "${PGUSER}" -d "${PGDATABASE}" {{ .Values.postgres.pgDumpArgs }} | \
                    aws s3 cp - "${S3_DEST}" ${EXTRA_S3_ARGS}

                  echo "[INFO] Snapshot archivé avec succès : ${S3_DEST}"

                  # Mise à jour du tag 'latest.dump'
                  aws s3 cp "${S3_DEST}" "${LATEST_DEST}" ${EXTRA_S3_ARGS}
                  echo "[INFO] latest.dump mis à jour."

                  {{- if .Values.s3.rollingRotation.enabled }}
                  MAX_KEEP={{ .Values.s3.rollingRotation.maxSnapshots | default 7 }}
                  echo "[INFO] Rotation Rolling : conservation stricte des ${MAX_KEEP} derniers snapshots..."

                  # Liste tous les snapshots triés par date/nom (format ISO chronologique), exclut latest.dump
                  ALL_SNAPSHOTS=$(aws s3 ls "s3://${S3_BUCKET}/${S3_PREFIX}/" ${EXTRA_S3_ARGS} | \
                    awk '{print $4}' | grep '\.dump$' | grep -v '^latest\.dump$' | sort)

                  TOTAL_COUNT=$(echo "${ALL_SNAPSHOTS}" | grep -c . || true)
                  echo "[INFO] Nombre total actuel de snapshots sur S3 : ${TOTAL_COUNT}"

                  if [ "${TOTAL_COUNT}" -gt "${MAX_KEEP}" ]; then
                    NB_TO_DELETE=$(( TOTAL_COUNT - MAX_KEEP ))
                    echo "[INFO] Suppression de ${NB_TO_DELETE} ancien(s) snapshot(s)..."

                    echo "${ALL_SNAPSHOTS}" | head -n "${NB_TO_DELETE}" | while read -r OLD_FILE; do
                      if [ -n "${OLD_FILE}" ]; then
                        echo "[-] Purge de l'ancien snapshot : ${OLD_FILE}"
                        aws s3 rm "s3://${S3_BUCKET}/${S3_PREFIX}/${OLD_FILE}" ${EXTRA_S3_ARGS}
                      fi
                    done
                  else
                    echo "[INFO] Quota respecté (${TOTAL_COUNT}/${MAX_KEEP}). Aucune purge nécessaire."
                  fi
                  {{- end }}

                  echo "[SUCCESS] Processus de sauvegarde et rotation rolling terminé !"
              env:
                - name: PGHOST
                  value: {{ .Values.postgres.host | quote }}
                - name: PGPORT
                  value: {{ .Values.postgres.port | quote }}
                - name: PGDATABASE
                  value: {{ .Values.postgres.database | quote }}
                - name: PGUSER
                  value: {{ .Values.postgres.username | quote }}
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: {{ default (printf "%s-pg-secret" (include "postgres-backup.fullname" .)) .Values.postgres.existingSecret }}
                      key: {{ .Values.postgres.secretKeyRef.passwordKey }}
                - name: AWS_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef:
                      name: {{ default (printf "%s-s3-secret" (include "postgres-backup.fullname" .)) .Values.s3.existingSecret }}
                      key: aws-access-key-id
                - name: AWS_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: {{ default (printf "%s-s3-secret" (include "postgres-backup.fullname" .)) .Values.s3.existingSecret }}
                      key: aws-secret-access-key
                - name: AWS_DEFAULT_REGION
                  value: {{ .Values.s3.region | quote }}
                - name: S3_BUCKET
                  value: {{ .Values.s3.bucket | quote }}
                - name: S3_PREFIX
                  value: {{ .Values.s3.prefix | quote }}
                - name: S3_ENDPOINT_URL
                  value: {{ .Values.s3.endpointUrl | quote }}
                {{- if .Values.s3.caCertConfigMap }}
                - name: AWS_CA_BUNDLE
                  value: "/etc/ssl/certs/s3-ca.crt"
                {{- end }}
              {{- if .Values.s3.caCertConfigMap }}
              volumeMounts:
                - name: s3-ca-cert
                  mountPath: /etc/ssl/certs/s3-ca.crt
                  subPath: {{ .Values.s3.caCertKey }}
                  readOnly: true
              {{- end }}
              resources:
                {{- toYaml .Values.resources | nindent 16 }}
          {{- if .Values.s3.caCertConfigMap }}
          volumes:
            - name: s3-ca-cert
              configMap:
                name: {{ .Values.s3.caCertConfigMap }}
          {{- end }}
