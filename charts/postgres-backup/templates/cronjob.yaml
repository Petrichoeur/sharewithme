apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "postgres-backup.fullname" . }}
  labels:
    {{- include "postgres-backup.labels" . | nindent 4 }}
spec:
  schedule: {{ .Values.cronjob.schedule | quote }}
  concurrencyPolicy: {{ .Values.cronjob.concurrencyPolicy }}
  successfulJobsHistoryLimit: {{ .Values.cronjob.successfulJobsHistoryLimit }}
  failedJobsHistoryLimit: {{ .Values.cronjob.failedJobsHistoryLimit }}
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels:
            {{- include "postgres-backup.selectorLabels" . | nindent 12 }}
        spec:
          restartPolicy: OnFailure
          {{- $pullSecrets := default .Values.global.imagePullSecrets .Values.backupJob.pullSecrets }}
          {{- with $pullSecrets }}
          imagePullSecrets:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumes:
            - name: backup-storage
              emptyDir: {}
            {{- if .Values.s3.customCa.enabled }}
            - name: custom-ca
              configMap:
                name: {{ .Values.s3.customCa.configMapName }}
            {{- end }}
          initContainers:
            # ÉTAPE 1 (ON-PREM) : pg_dump écrit le snapshot compressé sur le stockage temporaire
            - name: pg-dump
              image: {{ include "postgres-backup.postgresImage" . | quote }}
              imagePullPolicy: {{ .Values.backupJob.postgresImage.pullPolicy }}
              command:
                - /bin/sh
                - -c
                - |
                  set -euo pipefail
                  echo "[PG-DUMP] Démarrage du dump à chaud (${PGHOST}:${PGPORT} / base: ${PGDATABASE})..."
                  pg_dump -h "${PGHOST}" -p "${PGPORT}" -U "${PGUSER}" -d "${PGDATABASE}" {{ .Values.postgres.pgDumpArgs }} -f /backup/db.dump
                  echo "[PG-DUMP] Dump terminé avec succès ($(du -h /backup/db.dump | awk '{print $1}'))."
              env:
                - name: PGHOST
                  value: {{ .Values.postgres.host | quote }}
                - name: PGPORT
                  value: {{ .Values.postgres.port | quote }}
                - name: PGDATABASE
                  value: {{ .Values.postgres.database | quote }}
                - name: PGUSER
                  value: {{ .Values.postgres.username | quote }}
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: {{ default (printf "%s-pg-secret" (include "postgres-backup.fullname" .)) .Values.postgres.existingSecret }}
                      key: {{ .Values.postgres.secretKeyRef.passwordKey }}
              volumeMounts:
                - name: backup-storage
                  mountPath: /backup
              resources:
                {{- toYaml .Values.resources | nindent 16 }}

          containers:
            # ÉTAPE 2 (SORTIE S3 EXTERNE) : aws-cli envoie vers le S3 externe
            - name: s3-upload
              image: {{ include "postgres-backup.s3Image" . | quote }}
              imagePullPolicy: {{ .Values.backupJob.s3Image.pullPolicy }}
              command:
                - /bin/sh
                - -c
                - |
                  set -euo pipefail
                  TIMESTAMP=$(date -u +%Y%m%d_%H%M%SZ)
                  BACKUP_FILE="${PGDATABASE}_${TIMESTAMP}.dump"
                  S3_DEST="s3://${S3_BUCKET}/${S3_PREFIX}/${BACKUP_FILE}"
                  LATEST_DEST="s3://${S3_BUCKET}/${S3_PREFIX}/latest.dump"

                  EXTRA_S3_ARGS=""
                  if [ -n "${S3_ENDPOINT_URL:-}" ]; then
                    EXTRA_S3_ARGS="${EXTRA_S3_ARGS} --endpoint-url ${S3_ENDPOINT_URL}"
                  fi
                  if [ -n "${S3_SSE:-}" ]; then
                    EXTRA_S3_ARGS="${EXTRA_S3_ARGS} --sse ${S3_SSE}"
                  fi
                  if [ -n "${S3_KMS_KEY_ID:-}" ]; then
                    EXTRA_S3_ARGS="${EXTRA_S3_ARGS} --sse-kms-key-id ${S3_KMS_KEY_ID}"
                  fi
                  if [ -n "${AWS_CA_BUNDLE:-}" ]; then
                    EXTRA_S3_ARGS="${EXTRA_S3_ARGS} --ca-bundle ${AWS_CA_BUNDLE}"
                  fi

                  echo "[S3-UPLOAD] Upload vers S3 externe (${S3_DEST})..."
                  aws s3 cp /backup/db.dump "${S3_DEST}" ${EXTRA_S3_ARGS}
                  echo "[S3-UPLOAD] Upload terminé avec succès."

                  aws s3 cp "${S3_DEST}" "${LATEST_DEST}" ${EXTRA_S3_ARGS}
                  echo "[S3-UPLOAD] latest.dump mis à jour."

                  rm -f /backup/db.dump
                  echo "[S3-UPLOAD] Fichier local nettoyé."

                  {{- if .Values.s3.rollingRotation.enabled }}
                  MAX_KEEP={{ .Values.s3.rollingRotation.maxSnapshots | default 7 }}
                  echo "[S3-UPLOAD] Rotation Rolling : conservation des ${MAX_KEEP} derniers snapshots..."
                  ALL_SNAPSHOTS=$(aws s3 ls "s3://${S3_BUCKET}/${S3_PREFIX}/" ${EXTRA_S3_ARGS} | \
                    awk '{print $4}' | grep '\.dump$' | grep -v '^latest\.dump$' | sort)
                  
                  TOTAL_COUNT=$(echo "${ALL_SNAPSHOTS}" | grep -c . || true)
                  if [ "${TOTAL_COUNT}" -gt "${MAX_KEEP}" ]; then
                    NB_TO_DELETE=$(( TOTAL_COUNT - MAX_KEEP ))
                    echo "${ALL_SNAPSHOTS}" | head -n "${NB_TO_DELETE}" | while read -r OLD_FILE; do
                      if [ -n "${OLD_FILE}" ]; then
                        echo "[-] Suppression S3 : ${OLD_FILE}"
                        aws s3 rm "s3://${S3_BUCKET}/${S3_PREFIX}/${OLD_FILE}" ${EXTRA_S3_ARGS}
                      fi
                    done
                  fi
                  {{- end }}
                  echo "[SUCCESS] Sauvegarde terminée avec succès !"
              env:
                - name: PGDATABASE
                  value: {{ .Values.postgres.database | quote }}
                - name: AWS_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef:
                      name: {{ default (printf "%s-s3-secret" (include "postgres-backup.fullname" .)) .Values.s3.existingSecret }}
                      key: {{ .Values.s3.secretKeyRef.accessKeyIdKey }}
                - name: AWS_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: {{ default (printf "%s-s3-secret" (include "postgres-backup.fullname" .)) .Values.s3.existingSecret }}
                      key: {{ .Values.s3.secretKeyRef.secretAccessKeyKey }}
                - name: AWS_DEFAULT_REGION
                  value: {{ .Values.s3.region | quote }}
                - name: S3_BUCKET
                  value: {{ .Values.s3.bucket | quote }}
                - name: S3_PREFIX
                  value: {{ .Values.s3.prefix | quote }}
                {{- if .Values.s3.endpointUrl }}
                - name: S3_ENDPOINT_URL
                  value: {{ .Values.s3.endpointUrl | quote }}
                {{- end }}
                {{- if .Values.s3.serverSideEncryption }}
                - name: S3_SSE
                  value: {{ .Values.s3.serverSideEncryption | quote }}
                {{- end }}
                {{- if .Values.s3.kmsKeyId }}
                - name: S3_KMS_KEY_ID
                  value: {{ .Values.s3.kmsKeyId | quote }}
                {{- end }}
                {{- if .Values.s3.proxy.httpProxy }}
                - name: HTTP_PROXY
                  value: {{ .Values.s3.proxy.httpProxy | quote }}
                - name: http_proxy
                  value: {{ .Values.s3.proxy.httpProxy | quote }}
                {{- end }}
                {{- if .Values.s3.proxy.httpsProxy }}
                - name: HTTPS_PROXY
                  value: {{ .Values.s3.proxy.httpsProxy | quote }}
                - name: https_proxy
                  value: {{ .Values.s3.proxy.httpsProxy | quote }}
                {{- end }}
                {{- if .Values.s3.proxy.noProxy }}
                - name: NO_PROXY
                  value: {{ .Values.s3.proxy.noProxy | quote }}
                - name: no_proxy
                  value: {{ .Values.s3.proxy.noProxy | quote }}
                {{- end }}
                {{- if .Values.s3.customCa.enabled }}
                - name: AWS_CA_BUNDLE
                  value: "/etc/ssl/certs/s3-ca.crt"
                {{- end }}
              volumeMounts:
                - name: backup-storage
                  mountPath: /backup
                {{- if .Values.s3.customCa.enabled }}
                - name: custom-ca
                  mountPath: /etc/ssl/certs/s3-ca.crt
                  subPath: {{ .Values.s3.customCa.caKey }}
                  readOnly: true
                {{- end }}
              resources:
                {{- toYaml .Values.resources | nindent 16 }}
