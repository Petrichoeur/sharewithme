apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "postgres-backup.fullname" . }}
  labels:
    {{- include "postgres-backup.labels" . | nindent 4 }}
spec:
  schedule: {{ .Values.cronjob.schedule | quote }}
  {{- with .Values.cronjob.timeZone }}
  timeZone: {{ . | quote }}
  {{- end }}
  concurrencyPolicy: {{ .Values.cronjob.concurrencyPolicy }}
  startingDeadlineSeconds: {{ .Values.cronjob.startingDeadlineSeconds }}
  successfulJobsHistoryLimit: {{ .Values.cronjob.successfulJobsHistoryLimit }}
  failedJobsHistoryLimit: {{ .Values.cronjob.failedJobsHistoryLimit }}
  jobTemplate:
    spec:
      backoffLimit: {{ .Values.cronjob.backoffLimit }}
      activeDeadlineSeconds: {{ .Values.cronjob.activeDeadlineSeconds }}
      template:
        metadata:
          labels:
            {{- include "postgres-backup.selectorLabels" . | nindent 12 }}
            app.kubernetes.io/component: backup
        spec:
          restartPolicy: Never
          {{- include "postgres-backup.pullSecrets" . | nindent 10 }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumes:
            - name: work
              emptyDir:
                sizeLimit: {{ .Values.workVolume.sizeLimit }}
            {{- include "postgres-backup.s3Volumes" . | nindent 12 }}

          initContainers:
            - name: pg-dump
              image: {{ include "postgres-backup.postgresImage" . | quote }}
              imagePullPolicy: {{ .Values.backupJob.postgresImage.pullPolicy }}
              {{- with .Values.containerSecurityContext }}
              securityContext:
                {{- toYaml . | nindent 16 }}
              {{- end }}
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -euo pipefail
                  TS=$(date -u +%Y%m%dT%H%M%SZ)
                  OUT="/work/${TS}"
                  mkdir -p "${OUT}"

                  DBS="${PG_DATABASES:-$(psql -d postgres -AtX -c "SELECT datname FROM pg_database WHERE datallowconn AND NOT datistemplate ORDER BY datname")}"
                  [ -n "${DBS}" ] || exit 1

                  pg_dumpall -l postgres --globals-only -f "${OUT}/globals.sql"

                  for DB in ${DBS}; do
                    pg_dump -d "${DB}" {{ .Values.postgres.pgDumpArgs }} -f "${OUT}/${DB}.dump"
                    pg_restore --list "${OUT}/${DB}.dump" > /dev/null
                  done

                  echo "${TS}" > /work/TIMESTAMP
              env:
                {{- include "postgres-backup.pgEnv" . | nindent 16 }}
                - name: PG_DATABASES
                  value: {{ join " " .Values.postgres.databases | quote }}
              volumeMounts:
                - name: work
                  mountPath: /work
              resources:
                {{- toYaml .Values.resources | nindent 16 }}

          containers:
            - name: s3-upload
              image: {{ include "postgres-backup.s3Image" . | quote }}
              imagePullPolicy: {{ .Values.backupJob.s3Image.pullPolicy }}
              {{- with .Values.containerSecurityContext }}
              securityContext:
                {{- toYaml . | nindent 16 }}
              {{- end }}
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -euo pipefail
                  s3() { aws --endpoint-url "${S3_ENDPOINT}" s3 "$@"; }

                  TARGET_BUCKET="${S3_BUCKET}"
                  if [ -z "${TARGET_BUCKET}" ]; then
                    TARGET_BUCKET=$(s3 ls | awk '{print $3}' | grep -v '^$' | head -n 1 || true)
                    if [ -z "${TARGET_BUCKET}" ]; then
                      TARGET_BUCKET="backup-runai-backend"
                      s3 mb "s3://${TARGET_BUCKET}" || true
                    fi
                  fi

                  TS=$(cat /work/TIMESTAMP)
                  BASE="s3://${TARGET_BUCKET}/${S3_PREFIX}"

                  s3 cp "/work/${TS}/" "${BASE}/${TS}/" --recursive --only-show-errors
                  echo "${TS}" > /tmp/LATEST
                  s3 cp /tmp/LATEST "${BASE}/LATEST" --only-show-errors
                  rm -rf "/work/${TS}"

                  {{- if .Values.s3.rollingRotation.enabled }}
                  MAX={{ .Values.s3.rollingRotation.maxSnapshots | int }}
                  BACKUPS=$(s3 ls "${BASE}/" | sed -n 's#^ *PRE \([0-9]\{8\}T[0-9]\{6\}Z\)/$#\1#p' | sort)
                  COUNT=$(printf '%s\n' "${BACKUPS}" | sed '/^$/d' | wc -l)
                  if [ "${COUNT}" -gt "${MAX}" ]; then
                    printf '%s\n' "${BACKUPS}" | head -n $((COUNT - MAX)) | while read -r OLD; do
                      s3 rm "${BASE}/${OLD}/" --recursive --only-show-errors
                    done
                  fi
                  {{- end }}
              env:
                {{- include "postgres-backup.s3Env" . | nindent 16 }}
                {{- include "postgres-backup.s3Credentials" (dict "root" . "keys" .Values.s3.secretKeyRef) | nindent 16 }}
              volumeMounts:
                - name: work
                  mountPath: /work
                {{- include "postgres-backup.s3VolumeMounts" . | nindent 16 }}
              resources:
                {{- toYaml .Values.resources | nindent 16 }}
