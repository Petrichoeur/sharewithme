apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "postgres-backup.fullname" . }}
  labels:
    {{- include "postgres-backup.labels" . | nindent 4 }}
spec:
  schedule: {{ .Values.cronjob.schedule | quote }}
  concurrencyPolicy: {{ .Values.cronjob.concurrencyPolicy }}
  successfulJobsHistoryLimit: {{ .Values.cronjob.successfulJobsHistoryLimit }}
  failedJobsHistoryLimit: {{ .Values.cronjob.failedJobsHistoryLimit }}
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels:
            {{- include "postgres-backup.selectorLabels" . | nindent 12 }}
        spec:
          restartPolicy: OnFailure
          {{- $pullSecrets := default .Values.global.imagePullSecrets .Values.backupJob.pullSecrets }}
          {{- with $pullSecrets }}
          imagePullSecrets:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumes:
            - name: shared-pipe
              emptyDir:
                medium: Memory
          initContainers:
            # 1ÈRE IMAGE STANDARD : Exécute pg_dump et écrit dans un named pipe FIFO partagé
            - name: pg-dump-producer
              image: {{ include "postgres-backup.postgresImage" . | quote }}
              imagePullPolicy: {{ .Values.backupJob.postgresImage.pullPolicy }}
              command:
                - /bin/sh
                - -c
                - |
                  set -euo pipefail
                  echo "[PRODUCER] Création du FIFO partagé..."
                  rm -f /pipe/backup.fifo
                  mkfifo /pipe/backup.fifo

                  echo "[PRODUCER] Démarrage de pg_dump à chaud vers le pipe..."
                  pg_dump -h "${PGHOST}" -p "${PGPORT}" -U "${PGUSER}" -d "${PGDATABASE}" {{ .Values.postgres.pgDumpArgs }} > /pipe/backup.fifo
                  echo "[PRODUCER] pg_dump terminé avec succès."
              env:
                - name: PGHOST
                  value: {{ .Values.postgres.host | quote }}
                - name: PGPORT
                  value: {{ .Values.postgres.port | quote }}
                - name: PGDATABASE
                  value: {{ .Values.postgres.database | quote }}
                - name: PGUSER
                  value: {{ .Values.postgres.username | quote }}
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: {{ default (printf "%s-pg-secret" (include "postgres-backup.fullname" .)) .Values.postgres.existingSecret }}
                      key: {{ .Values.postgres.secretKeyRef.passwordKey }}
              volumeMounts:
                - name: shared-pipe
                  mountPath: /pipe
              resources:
                {{- toYaml .Values.resources | nindent 16 }}

          containers:
            # 2ÈME IMAGE STANDARD : Lit le FIFO en streaming et l'envoie sur S3 (Zero local disk)
            - name: s3-uploader-consumer
              image: {{ include "postgres-backup.s3Image" . | quote }}
              imagePullPolicy: {{ .Values.backupJob.s3Image.pullPolicy }}
              command:
                - /bin/sh
                - -c
                - |
                  set -euo pipefail
                  TIMESTAMP=$(date -u +%Y%m%d_%H%M%SZ)
                  BACKUP_FILE="${PGDATABASE}_${TIMESTAMP}.dump"
                  S3_DEST="s3://${S3_BUCKET}/${S3_PREFIX}/${BACKUP_FILE}"
                  LATEST_DEST="s3://${S3_BUCKET}/${S3_PREFIX}/latest.dump"

                  EXTRA_S3_ARGS=""
                  if [ -n "${S3_ENDPOINT_URL:-}" ]; then
                    EXTRA_S3_ARGS="--endpoint-url ${S3_ENDPOINT_URL}"
                  fi

                  echo "[CONSUMER] Lecture du FIFO et streaming vers S3 (${S3_DEST})..."
                  aws s3 cp /pipe/backup.fifo "${S3_DEST}" ${EXTRA_S3_ARGS}
                  echo "[CONSUMER] Snapshot uploadé avec succès !"

                  aws s3 cp "${S3_DEST}" "${LATEST_DEST}" ${EXTRA_S3_ARGS}
                  echo "[CONSUMER] latest.dump mis à jour."

                  {{- if .Values.s3.rollingRotation.enabled }}
                  MAX_KEEP={{ .Values.s3.rollingRotation.maxSnapshots | default 7 }}
                  echo "[CONSUMER] Rotation Rolling : conservation des ${MAX_KEEP} derniers snapshots..."
                  ALL_SNAPSHOTS=$(aws s3 ls "s3://${S3_BUCKET}/${S3_PREFIX}/" ${EXTRA_S3_ARGS} | \
                    awk '{print $4}' | grep '\.dump$' | grep -v '^latest\.dump$' | sort)
                  
                  TOTAL_COUNT=$(echo "${ALL_SNAPSHOTS}" | grep -c . || true)
                  if [ "${TOTAL_COUNT}" -gt "${MAX_KEEP}" ]; then
                    NB_TO_DELETE=$(( TOTAL_COUNT - MAX_KEEP ))
                    echo "${ALL_SNAPSHOTS}" | head -n "${NB_TO_DELETE}" | while read -r OLD_FILE; do
                      if [ -n "${OLD_FILE}" ]; then
                        echo "[-] Suppression : ${OLD_FILE}"
                        aws s3 rm "s3://${S3_BUCKET}/${S3_PREFIX}/${OLD_FILE}" ${EXTRA_S3_ARGS}
                      fi
                    done
                  fi
                  {{- end }}
                  echo "[SUCCESS] Backup et rotation terminés avec succès !"
              env:
                - name: PGDATABASE
                  value: {{ .Values.postgres.database | quote }}
                - name: AWS_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef:
                      name: {{ default (printf "%s-s3-secret" (include "postgres-backup.fullname" .)) .Values.s3.existingSecret }}
                      key: aws-access-key-id
                - name: AWS_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: {{ default (printf "%s-s3-secret" (include "postgres-backup.fullname" .)) .Values.s3.existingSecret }}
                      key: aws-secret-access-key
                - name: AWS_DEFAULT_REGION
                  value: {{ .Values.s3.region | quote }}
                - name: S3_BUCKET
                  value: {{ .Values.s3.bucket | quote }}
                - name: S3_PREFIX
                  value: {{ .Values.s3.prefix | quote }}
                - name: S3_ENDPOINT_URL
                  value: {{ .Values.s3.endpointUrl | quote }}
              volumeMounts:
                - name: shared-pipe
                  mountPath: /pipe
              resources:
                {{- toYaml .Values.resources | nindent 16 }}
