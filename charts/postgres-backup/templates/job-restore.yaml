{{- if .Values.restore.enabled }}
{{- if ne .Values.restore.confirm "RESTORE" }}
{{- fail "restore.enabled=true : ajouter restore.confirm=RESTORE pour confirmer (les données actuelles seront écrasées)" }}
{{- end }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "postgres-backup.fullname" . }}-restore
  labels:
    {{- include "postgres-backup.labels" . | nindent 4 }}
    app.kubernetes.io/component: restore
spec:
  backoffLimit: 0
  activeDeadlineSeconds: {{ .Values.cronjob.activeDeadlineSeconds }}
  template:
    metadata:
      labels:
        {{- include "postgres-backup.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: restore
    spec:
      restartPolicy: Never
      {{- include "postgres-backup.pullSecrets" . | nindent 6 }}
      {{- with .Values.securityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      volumes:
        - name: work
          emptyDir:
            sizeLimit: {{ .Values.workVolume.sizeLimit }}
        {{- include "postgres-backup.s3Volumes" . | nindent 8 }}

      initContainers:
        # 1) Téléchargement de la sauvegarde depuis le S3 (credentials lecture seule)
        - name: s3-download
          image: {{ include "postgres-backup.s3Image" . | quote }}
          imagePullPolicy: {{ .Values.backupJob.s3Image.pullPolicy }}
          {{- with .Values.containerSecurityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -euo pipefail
              s3() { aws --endpoint-url "${S3_ENDPOINT}" s3 "$@"; }
              BASE="s3://${S3_BUCKET}/${S3_PREFIX}"

              if [ "${RESTORE_BACKUP}" = "latest" ]; then
                TS=$(s3 cp "${BASE}/LATEST" - | tr -d '[:space:]')
              else
                TS="${RESTORE_BACKUP}"
              fi
              echo "[INFO] Téléchargement de la sauvegarde ${BASE}/${TS}/"
              s3 cp "${BASE}/${TS}/" /work/ --recursive --only-show-errors

              if ! ls /work/*.dump > /dev/null 2>&1; then
                echo "[ERREUR] Aucun dump trouvé dans ${BASE}/${TS}/"
                exit 1
              fi
              ls -lh /work
          env:
            {{- include "postgres-backup.s3Env" . | nindent 12 }}
            {{- include "postgres-backup.s3Credentials" (dict "root" . "keys" .Values.s3.restoreSecretKeyRef) | nindent 12 }}
            - name: RESTORE_BACKUP
              value: {{ .Values.restore.backup | quote }}
          volumeMounts:
            - name: work
              mountPath: /work
            {{- include "postgres-backup.s3VolumeMounts" . | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}

      containers:
        # 2) pg_restore atomique, refusé si des connexions applicatives sont actives
        - name: pg-restore
          image: {{ include "postgres-backup.postgresImage" . | quote }}
          imagePullPolicy: {{ .Values.backupJob.postgresImage.pullPolicy }}
          {{- with .Values.containerSecurityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -euo pipefail
              if [ -n "${RESTORE_DATABASES}" ]; then
                DBS="${RESTORE_DATABASES}"
              else
                DBS=$(cd /work && ls -1 *.dump | sed 's/\.dump$//')
              fi

              for DB in ${DBS}; do
                F="/work/${DB}.dump"
                [ -f "${F}" ] || { echo "[ERREUR] ${DB}.dump absent de la sauvegarde"; exit 1; }

                EXISTS=$(psql -d postgres -AtX -c "SELECT 1 FROM pg_database WHERE datname = '${DB}'")
                if [ -z "${EXISTS}" ]; then
                  echo "[INFO] Base ${DB} inexistante : création"
                  createdb "${DB}"
                else
                  ACTIVE=$(psql -d postgres -AtX -c "SELECT count(*) FROM pg_stat_activity WHERE datname = '${DB}' AND pid <> pg_backend_pid()")
                  if [ "${ACTIVE}" -ne 0 ]; then
                    echo "[ERREUR] ${ACTIVE} connexion(s) active(s) sur ${DB} : arrêter le backend Run:ai avant de restaurer"
                    exit 1
                  fi
                fi

                echo "[INFO] pg_restore ${DB}"
                pg_restore -d "${DB}" {{ .Values.restore.pgRestoreArgs }} "${F}"
                echo "[OK] ${DB} restaurée"
              done
              echo "[SUCCESS] Restauration terminée"
          env:
            {{- include "postgres-backup.pgEnv" . | nindent 12 }}
            - name: RESTORE_DATABASES
              value: {{ join " " .Values.restore.databases | quote }}
          volumeMounts:
            - name: work
              mountPath: /work
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
{{- end }}
