{{- if .Values.restore.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "postgres-backup.fullname" . }}-restore-{{ now | date "20060102150405" }}
  labels:
    {{- include "postgres-backup.labels" . | nindent 4 }}
    app.kubernetes.io/component: restore-job
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 1
  template:
    metadata:
      labels:
        {{- include "postgres-backup.selectorLabels" . | nindent 8 }}
    spec:
      restartPolicy: Never
      {{- $pullSecrets := default .Values.global.imagePullSecrets .Values.backupJob.pullSecrets }}
      {{- with $pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.securityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      volumes:
        - name: shared-pipe
          emptyDir:
            medium: Memory
      initContainers:
        # 1ÈRE IMAGE STANDARD : Télécharge le snapshot depuis S3 et l'écrit dans le pipe FIFO
        - name: s3-downloader-producer
          image: {{ include "postgres-backup.s3Image" . | quote }}
          imagePullPolicy: {{ .Values.backupJob.s3Image.pullPolicy }}
          command:
            - /bin/sh
            - -c
            - |
              set -euo pipefail
              rm -f /pipe/restore.fifo
              mkfifo /pipe/restore.fifo

              TARGET_FILE="{{ .Values.restore.dumpFile }}"
              EXTRA_S3_ARGS=""
              if [ -n "${S3_ENDPOINT_URL:-}" ]; then
                EXTRA_S3_ARGS="--endpoint-url ${S3_ENDPOINT_URL}"
              fi

              if [ "$TARGET_FILE" = "latest" ]; then
                S3_SOURCE="s3://${S3_BUCKET}/${S3_PREFIX}/latest.dump"
              else
                S3_SOURCE="s3://${S3_BUCKET}/${S3_PREFIX}/${TARGET_FILE}"
              fi

              echo "[RESTORE-PRODUCER] Téléchargement depuis ${S3_SOURCE} vers le FIFO..."
              aws s3 cp "${S3_SOURCE}" /pipe/restore.fifo ${EXTRA_S3_ARGS}
              echo "[RESTORE-PRODUCER] Téléchargement terminé."
          env:
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: {{ default (printf "%s-s3-secret" (include "postgres-backup.fullname" .)) .Values.s3.existingSecret }}
                  key: aws-access-key-id
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ default (printf "%s-s3-secret" (include "postgres-backup.fullname" .)) .Values.s3.existingSecret }}
                  key: aws-secret-access-key
            - name: AWS_DEFAULT_REGION
              value: {{ .Values.s3.region | quote }}
            - name: S3_BUCKET
              value: {{ .Values.s3.bucket | quote }}
            - name: S3_PREFIX
              value: {{ .Values.s3.prefix | quote }}
            - name: S3_ENDPOINT_URL
              value: {{ .Values.s3.endpointUrl | quote }}
          volumeMounts:
            - name: shared-pipe
              mountPath: /pipe
          resources:
            {{- toYaml .Values.resources | nindent 12 }}

      containers:
        # 2ÈME IMAGE STANDARD : Lit le FIFO et restaure dans PostgreSQL avec pg_restore
        - name: pg-restore-consumer
          image: {{ include "postgres-backup.postgresImage" . | quote }}
          imagePullPolicy: {{ .Values.backupJob.postgresImage.pullPolicy }}
          command:
            - /bin/sh
            - -c
            - |
              set -euo pipefail
              echo "[RESTORE-CONSUMER] Lecture du FIFO et restauration vers ${PGDATABASE}..."
              pg_restore -h "${PGHOST}" -p "${PGPORT}" -U "${PGUSER}" -d "${PGDATABASE}" {{ .Values.restore.pgRestoreArgs }} < /pipe/restore.fifo
              echo "[SUCCESS] Base PostgreSQL restaurée avec succès !"
          env:
            - name: PGHOST
              value: {{ .Values.postgres.host | quote }}
            - name: PGPORT
              value: {{ .Values.postgres.port | quote }}
            - name: PGDATABASE
              value: {{ .Values.postgres.database | quote }}
            - name: PGUSER
              value: {{ .Values.postgres.username | quote }}
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ default (printf "%s-pg-secret" (include "postgres-backup.fullname" .)) .Values.postgres.existingSecret }}
                  key: {{ .Values.postgres.secretKeyRef.passwordKey }}
          volumeMounts:
            - name: shared-pipe
              mountPath: /pipe
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
{{- end }}
