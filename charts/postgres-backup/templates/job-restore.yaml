{{- if .Values.restore.enabled }}
{{- if ne .Values.restore.confirm "RESTORE" }}
{{- fail "restore.enabled=true : set restore.confirm=RESTORE to confirm database overwrite" }}
{{- end }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "postgres-backup.fullname" . }}-restore
  labels:
    {{- include "postgres-backup.labels" . | nindent 4 }}
    app.kubernetes.io/component: restore
spec:
  backoffLimit: 0
  activeDeadlineSeconds: {{ .Values.cronjob.activeDeadlineSeconds }}
  template:
    metadata:
      labels:
        {{- include "postgres-backup.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: restore
    spec:
      restartPolicy: Never
      {{- include "postgres-backup.pullSecrets" . | nindent 6 }}
      {{- with .Values.securityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      volumes:
        - name: work
          emptyDir:
            sizeLimit: {{ .Values.workVolume.sizeLimit }}
        {{- include "postgres-backup.s3Volumes" . | nindent 8 }}

      initContainers:
        - name: s3-download
          image: {{ include "postgres-backup.s3Image" . | quote }}
          imagePullPolicy: {{ .Values.backupJob.s3Image.pullPolicy }}
          {{- with .Values.containerSecurityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -euo pipefail
              s3() { aws --endpoint-url "${S3_ENDPOINT}" s3 "$@"; }

              TARGET_BUCKET="${S3_BUCKET}"
              if [ -z "${TARGET_BUCKET}" ]; then
                TARGET_BUCKET=$(s3 ls | awk '{print $3}' | grep -v '^$' | head -n 1 || true)
                [ -n "${TARGET_BUCKET}" ] || exit 1
              fi

              BASE="s3://${TARGET_BUCKET}/${S3_PREFIX}"

              if [ "${RESTORE_BACKUP}" = "latest" ]; then
                TS=$(s3 cp "${BASE}/LATEST" - | tr -d '[:space:]')
              else
                TS="${RESTORE_BACKUP}"
              fi

              s3 cp "${BASE}/${TS}/" /work/ --recursive --only-show-errors
              ls /work/*.dump > /dev/null 2>&1 || exit 1
          env:
            {{- include "postgres-backup.s3Env" . | nindent 12 }}
            {{- include "postgres-backup.s3Credentials" (dict "root" . "keys" .Values.s3.restoreSecretKeyRef) | nindent 12 }}
            - name: RESTORE_BACKUP
              value: {{ .Values.restore.backup | quote }}
          volumeMounts:
            - name: work
              mountPath: /work
            {{- include "postgres-backup.s3VolumeMounts" . | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}

      containers:
        - name: pg-restore
          image: {{ include "postgres-backup.postgresImage" . | quote }}
          imagePullPolicy: {{ .Values.backupJob.postgresImage.pullPolicy }}
          {{- with .Values.containerSecurityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -euo pipefail
              DBS="${RESTORE_DATABASES:-$(cd /work && ls -1 *.dump | sed 's/\.dump$//')}"

              for DB in ${DBS}; do
                F="/work/${DB}.dump"
                [ -f "${F}" ] || exit 1

                EXISTS=$(psql -d postgres -AtX -c "SELECT 1 FROM pg_database WHERE datname = '${DB}'")
                if [ -z "${EXISTS}" ]; then
                  createdb "${DB}"
                else
                  ACTIVE=$(psql -d postgres -AtX -c "SELECT count(*) FROM pg_stat_activity WHERE datname = '${DB}' AND pid <> pg_backend_pid()")
                  if [ "${ACTIVE}" -ne 0 ]; then
                    echo "Active connections on ${DB}, aborting restore" >&2
                    exit 1
                  fi
                fi

                pg_restore -d "${DB}" {{ .Values.restore.pgRestoreArgs }} "${F}"
              done
          env:
            {{- include "postgres-backup.pgEnv" . | nindent 12 }}
            - name: RESTORE_DATABASES
              value: {{ join " " .Values.restore.databases | quote }}
          volumeMounts:
            - name: work
              mountPath: /work
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
{{- end }}
